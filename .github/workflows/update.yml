name: Обновить архив

# Раз в сутки: скачать таблицу, дописать страны, записать снимок дня.
# Запустить руками можно на вкладке Actions — кнопка «Run workflow».
on:
  schedule:
    - cron: '17 4 * * *'      # 04:17 UTC, около 07:17 по Москве
  workflow_dispatch:
    inputs:
      countries:
        description: 'Сколько исполнителей спросить у MusicBrainz за прогон (1 запрос в секунду)'
        required: false
        default: '400'
      retry_missing:
        description: 'Переспросить тех, у кого страна не нашлась'
        type: boolean
        required: false
        default: false

# Нужно, чтобы Actions мог коммитить в репозиторий
permissions:
  contents: write

concurrency:
  group: update-archive
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 100

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Скачать таблицу
        env:
          SHEET_ID: 1yEUr29llt9L1zWavC4lxkyhd6UeIwrQuGsPon9fXt4A
          SHEET_GID: '1372192852'
        run: node scripts/fetch-sheet.mjs

      - name: Записать снимок дня
        run: node scripts/snapshot.mjs

      # По расписанию берём небольшую порцию: новых исполнителей за сутки
      # набегает немного, а лимит MusicBrainz — один запрос в секунду.
      # Первый полный прогон делается руками, с большим числом.
      - name: Дописать страны из MusicBrainz
        continue-on-error: true      # страны не должны ронять обновление архива
        run: |
          LIMIT="${{ github.event.inputs.countries || '150' }}"
          EXTRA=""
          if [ "${{ github.event.inputs.retry_missing }}" = "true" ]; then
            EXTRA="--retry-missing"
          fi
          # --max-minutes держит шаг в рамках: скрипт останавливается сам,
          # и накопленное успевает закоммититься. Кэш пишется по ходу,
          # так что следующий запуск продолжит с того же места.
          node scripts/countries.mjs --limit "$LIMIT" --max-minutes 80 $EXTRA

      - name: Закоммитить, если что-то изменилось
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.csv data/countries.json data/history.jsonl
          if git diff --staged --quiet; then
            echo "изменений нет"
            exit 0
          fi
          RATED=$(node -e "
            const fs=require('fs');
            const l=fs.readFileSync('data/history.jsonl','utf8').trim().split('\n');
            process.stdout.write(String(JSON.parse(l[l.length-1]).rated));
          ")
          git commit -m "Обновить архив: $RATED разносов ($(date -u +%Y-%m-%d))"

          # Пока шёл прогон (а он длится до часа с лишним), в main могли
          # запушить руками. Без этого push упёрся бы в несовпадение и
          # уронил задачу, потеряв всё, что насчитали. Наши коммиты трогают
          # только data.csv, countries.json и history.jsonl, так что
          # перенос поверх чужих изменений безопасен.
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "попытка $i не прошла, жду"
            sleep $((i * 5))
          done
          echo "не удалось запушить за 5 попыток"
          exit 1
