name: Разведка animethemes

# Запускается только руками. Из песочницы разработки animethemes.moe
# недоступен, поэтому структуру их API смотрим отсюда — по логам.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/animethemes.mjs --probe
