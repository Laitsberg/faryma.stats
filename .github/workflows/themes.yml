name: Каталог тем animethemes

# Запускается только руками. Из песочницы разработки animethemes.moe
# недоступен, поэтому структуру их API смотрим отсюда — по логам.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Сколько тайтлов спросить за прогон'
        required: false
        default: '1200'
      args:
        description: 'Дополнительные флаги (--probe, --q "…", --recheck)'
        required: false
        default: ''
      minutes:
        description: 'Сколько минут спрашивать'
        required: false
        default: '60'
      retry_missing:
        description: 'Переспросить ненайденных'
        type: boolean
        required: false
        default: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Собрать каталог опенингов и эндингов
        env:
          IN_ARGS:  ${{ github.event.inputs.args }}
          IN_LIMIT: ${{ github.event.inputs.limit }}
          IN_RETRY: ${{ github.event.inputs.retry_missing }}
          IN_MINUTES: ${{ github.event.inputs.minutes }}
        run: |
          EXTRA=""
          if [ "$IN_RETRY" = "true" ]; then EXTRA="--retry-missing"; fi
          eval "node scripts/animethemes.mjs $IN_ARGS --limit ${IN_LIMIT:-1200} --max-minutes ${IN_MINUTES:-60} $EXTRA"

      - name: Закоммитить каталог
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/themes.json
          if git diff --staged --quiet; then echo "изменений нет"; exit 0; fi
          git commit -m "Каталог опенингов и эндингов из animethemes"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
