name: Список роликов с канала

# Ролики выходят когда выходят, а список нужен свежий: без него в
# карточке вселенной не будет ссылки на новый разбор. Раз в четыре
# часа — компромисс между «появится в тот же вечер» и «не дёргать
# ютуб попусту». Руками тоже можно, кнопкой Run workflow.
on:
  schedule:
    - cron: '25 */4 * * *'     # каждые четыре часа
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Поставить yt-dlp
        run: pipx install yt-dlp || pip install --user yt-dlp

      - name: Собрать список
        run: node scripts/videos.mjs

      - name: Закоммитить список
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json
          if git diff --staged --quiet; then echo "изменений нет"; exit 0; fi
          git commit -m "Список роликов с канала"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
