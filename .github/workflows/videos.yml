name: Список роликов с канала

# Ролики выходят редко — раз в несколько недель, — а список из-за
# расписания дёргался шесть раз в сутки и почти всегда впустую.
# Поэтому запускается только руками: вышел новый разбор — открыть
# вкладку Actions, выбрать эту задачу, нажать «Run workflow».
# Через минуту ссылка на ролик появится в карточке вселенной.
on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Поставить yt-dlp
        run: pipx install yt-dlp || pip install --user yt-dlp

      - name: Собрать список
        run: node scripts/videos.mjs

      - name: Закоммитить список
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json
          if git diff --staged --quiet; then echo "изменений нет"; exit 0; fi
          git commit -m "Список роликов с канала"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
