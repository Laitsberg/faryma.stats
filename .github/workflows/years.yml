name: Года выпуска треков

# Докачивает года выпуска из MusicBrainz в data/years.json.
#
# Отдельным воркфлоу, а не шагом в «Обновить архив», по времени: там на
# весь job отведено 100 минут, из которых 80 уже забирают страны. Песен
# в архиве около шести с половиной тысяч, лимит MusicBrainz — один
# запрос в секунду, то есть полный первый проход это часа два. Кэш
# пишется по ходу, поэтому прогон можно рвать на куски: следующий
# запуск продолжит с того же места.
#
# Ночью раз в сутки — за пару ночей архив разберётся целиком, дальше
# спрашивать придётся только про новые треки, а их за день десятки.
#
# Источник по умолчанию — Spotify: у 934 треков ссылка в таблице ведёт
# прямо на запись (19 запросов пачками по 50, без всякого угадывания),
# а поиск понимает ромадзи — то, на чём сломался MusicBrainz: там по
# запросу «Usseewa» японская «うっせぇわ» не находится вовсе, и год
# выходил 2025-й вместо 2020-го. Нужны секреты репозитория
# SPOTIFY_CLIENT_ID и SPOTIFY_CLIENT_SECRET (бесплатное приложение на
# developer.spotify.com). Без них шаг сам скажет, чего не хватает.
#
# Расписание частое и заходы короткие — так вышло из-за лимита
# Spotify. Он не «притормози», а «окно закрыто»: получив за раз слишком
# много запросов, он отвечает 429 с Retry-After в час с лишним, и
# пересиживать это внутри прогона бессмысленно. Поэтому скрипт при
# длинном Retry-After заканчивается сам, коммитит собранное, а следующий
# заход через три часа продолжает с того же места. Первичный обход
# шести с половиной тысяч песен так занимает пару суток; когда он
# закончится, частоту можно вернуть к разу в сутки — новых треков за
# день десятки.
#
# Запускаемся ВСЛЕД за «Обновить архив», а не только по своему крону.
# Причина простая: собственный крон этого воркфлоу не сработал ни разу
# — ноль запусков с событием schedule, — а у «Обновить архив» крон
# ходит исправно и архив обновляется каждый день. Событие
# workflow_run надёжнее расписания, и заодно логично: сначала свежая
# таблица, следом года и обложки для того, что в ней появилось.
# Крон оставлен на случай, если он всё-таки оживёт: лишний заход
# ничего не портит, кэш не даёт спрашивать одно и то же дважды.
on:
  workflow_run:
    workflows: ['Обновить архив']
    types: [completed]
  schedule:
    - cron: '17 */3 * * *'     # каждые три часа
  workflow_dispatch:
    inputs:
      limit:
        description: 'Сколько песен спросить за прогон'
        required: false
        default: '1500'
      minutes:
        description: 'Сколько минут спрашивать'
        required: false
        default: '25'
      retry_missing:
        description: 'Переспросить те, у которых год не нашёлся'
        type: boolean
        required: false
        default: false
      recheck:
        description: 'Переспросить найденных по прежним правилам совпадения'
        type: boolean
        required: false
        default: false
      crosscheck:
        description: 'Сверять год по ссылке ещё и поиском (вдвое больше запросов)'
        type: boolean
        required: false
        default: false
      recheck_reissues:
        description: 'Пересверить только те ссылки, что ведут на концертник или ремастер'
        type: boolean
        required: false
        default: false
      probe:
        description: 'Только пощупать API и показать ответы (ничего не пишет)'
        type: boolean
        required: false
        default: false
      source:
        description: 'Откуда брать года'
        type: choice
        required: false
        default: spotify
        options: [spotify, musicbrainz]

concurrency:
  group: years-musicbrainz
  cancel-in-progress: false

jobs:
  years:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Спросить года
        env:
          IN_LIMIT: ${{ github.event.inputs.limit }}
          IN_MINUTES: ${{ github.event.inputs.minutes }}
          IN_RETRY: ${{ github.event.inputs.retry_missing }}
          IN_RECHECK: ${{ github.event.inputs.recheck }}
          IN_SOURCE: ${{ github.event.inputs.source }}
          IN_PROBE: ${{ github.event.inputs.probe }}
          IN_CROSSCHECK: ${{ github.event.inputs.crosscheck }}
          IN_REISSUES: ${{ github.event.inputs.recheck_reissues }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          EXTRA=""
          if [ "$IN_RETRY" = "true" ]; then EXTRA="--retry-missing"; fi
          if [ "$IN_RECHECK" = "true" ]; then EXTRA="$EXTRA --recheck"; fi
          if [ "$IN_PROBE" = "true" ]; then EXTRA="$EXTRA --probe"; fi
          if [ "$IN_CROSSCHECK" = "true" ]; then EXTRA="$EXTRA --crosscheck"; fi
          if [ "$IN_REISSUES" = "true" ]; then EXTRA="$EXTRA --recheck-reissues"; fi
          # --max-minutes держит прогон в рамках job'а: скрипт
          # останавливается сам, и накопленное успевает закоммититься.
          node scripts/years.mjs --source "${IN_SOURCE:-spotify}" \
            --limit "${IN_LIMIT:-1500}" --max-minutes "${IN_MINUTES:-25}" $EXTRA

      # if: always() — чтобы накопленное коммитилось даже если шаг выше
      # упал на середине. Час запросов дороже, чем аккуратный выход.
      - name: Закоммитить года
        if: always()
        env:
          IN_SOURCE: ${{ github.event.inputs.source }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/years.json
          if git diff --staged --quiet; then echo "изменений нет"; exit 0; fi
          # Имя переменной только латиницей: bash кириллицу за имя не
          # держит и валит шаг с «command not found» — на этом уже
          # потерялся один часовой прогон.
          FOUND=$(node -e "
            const d=require('./data/years.json');
            const v=Object.values(d.tracks||{});
            process.stdout.write(v.filter(x=>x.year).length+' из '+v.length);
          " || echo "порция")
          git commit -m "Года выпуска (${IN_SOURCE:-spotify}): $FOUND"
          # Пока шёл прогон, в main мог прилететь ночной архив — переносим
          # поверх: наш коммит трогает только data/years.json.
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "попытка $i не прошла, жду"
            sleep $((i * 5))
          done
          echo "не удалось запушить за 5 попыток"
          exit 1
